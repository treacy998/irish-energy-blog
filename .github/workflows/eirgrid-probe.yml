name: eirgrid-probe

# DIAGNOSTIC, dispatch-only. Asks EirGrid's dashboard for wind and demand exactly as pipeline/fetch.py does,
# 6 rounds 30 s apart, and prints the table (status, size, rows, rate-limit/CDN headers) plus this runner's
# public IP, to compare with the same script run from a laptop. Read-only: no commit, no push, no secrets.
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Space-separated delivery dates to probe"
        required: false
        type: string
        default: "2026-10-23 2026-10-24"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements-ci.txt

      - run: pip install -r pipeline/requirements-ci.txt

      - name: Runner public IP
        run: curl -s https://api.ipify.org; echo

      - name: Probe EirGrid
        env:
          PROBE_DATES: ${{ inputs.dates }}
        run: python pipeline/probe_eirgrid.py --dates $PROBE_DATES --rounds 6 --interval 30
